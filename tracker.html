<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SKAX Time Tracker - Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">‹ Home</a>
      <span style="color: var(--text-dim); font-size: 13px;">/</span>
      <h1>⏱️ SKAX Time Tracker</h1>
    </div>
  </header>

  <main style="max-width: 540px;">
    <!-- Active Session Card -->
    <div class="tracker-card">
      <div id="session-status" class="timer-status">
        <span class="badge-dot"></span>
        <span id="status-text">Ready to Check-in</span>
      </div>

      <div id="timer-display" class="timer-display">00:00:00</div>
      <div style="font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 4px;">Today's total</div>

      <div class="tracker-controls">
        <button id="btn-checkin" class="btn-track btn-checkin">
          <span>▶ Check-in</span>
        </button>
        <button id="btn-checkout" class="btn-track btn-checkout" disabled>
          <span>⏹ Check-out</span>
        </button>
      </div>
    </div>

    <!-- History Section with Tabs -->
    <div style="margin-top: 28px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div style="display: flex; gap: 8px;">
          <button id="tab-today" class="history-tab active">Today</button>
          <button id="tab-month" class="history-tab">This Month</button>
        </div>
        <span id="total-days-count" style="font-size: 12px; color: var(--text-dim);">0 days this month</span>
      </div>
      <div id="history-list" class="history-container">
        <p class="empty-state">No time logs this month. Press Check-in to start.</p>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/tracker.js"></script>
</body>
</html>
