<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Personal Notion-like App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">← Home</a>
      <h1>My Notes</h1>
    </div>
    <button id="new-note-btn">+ New Note</button>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" id="search-notes" placeholder="Search notes...">
    </div>

    <div id="loading" class="loading" style="display: none;">Loading...</div>

    <section id="notes-list">
      <!-- Notes will be inserted here -->
      <p class="empty-state">No notes yet. Click "+ New Note" to create one.</p>
    </section>
  </main>

  <!-- Note Form Modal -->
  <div id="note-modal" class="modal">
    <div class="modal-content">
      <h2>New Note</h2>
      <form id="note-form">
        <input type="text" id="note-title" placeholder="Note title" required>
        <textarea id="note-content" placeholder="Write something..." rows="6" required></textarea>
        <div class="form-actions">
          <button type="button" id="cancel-note">Cancel</button>
          <button type="submit">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Note Detail Modal -->
  <div id="note-detail-modal" class="modal">
    <div class="modal-content modal-detail">
      <div class="detail-header">
        <h2 class="detail-title"></h2>
        <button class="close-detail" onclick="this.closest('.modal').style.display='none'">✕</button>
      </div>
      <div class="detail-content"></div>
      <div class="detail-footer">
        <small class="detail-date"></small>
        <div class="detail-actions">
          <button class="btn-secondary" onclick="document.getElementById('note-detail-modal').style.display='none'; editNote(this.closest('.modal').dataset.noteId);">Edit</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/notes.js"></script>
  <script>
    // Make editNote available globally for the detail modal
    window.editNote = function(id) {
      const event = new CustomEvent('editNote', { detail: { id } });
      document.dispatchEvent(event);
    };
  </script>
</body>
</html>
