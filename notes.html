<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notes - Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">‹ Home</a>
      <span style="color: var(--text-dim); font-size: 13px;">/</span>
      <h1>📝 Notes</h1>
    </div>
    <button id="new-note-btn">+ New</button>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" id="search-notes" placeholder="Filter notes..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div id="loading" class="loading" style="display: none;">Loading...</div>

    <section id="notes-list">
      <p class="empty-state">No notes yet. Click <strong>+ New</strong> to create one.</p>
    </section>
  </main>

  <!-- Note Form Modal -->
  <div id="note-modal" class="modal">
    <div class="modal-content">
      <h2>New page</h2>
      <form id="note-form">
        <label>Title
          <input type="text" id="note-title" placeholder="Untitled" required autocomplete="off">
        </label>
        <label>Content
          <textarea id="note-content" placeholder="Press enter to start typing..." rows="6" required></textarea>
        </label>
        <div class="form-actions">
          <button type="button" id="cancel-note">Cancel</button>
          <button type="submit">Done</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Note Detail Modal -->
  <div id="note-detail-modal" class="modal">
    <div class="modal-content modal-detail">
      <div class="detail-header">
        <h2 class="detail-title"></h2>
        <button class="close-detail" onclick="this.closest('.modal').style.display='none'">✕</button>
      </div>
      <div class="detail-content"></div>
      <div class="detail-footer">
        <small class="detail-date"></small>
        <div class="detail-actions">
          <button class="btn-secondary" onclick="document.getElementById('note-detail-modal').style.display='none'; editNote(this.closest('.modal').dataset.noteId);">Edit</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/notes.js"></script>
  <script>
    window.editNote = function(id) {
      document.dispatchEvent(new CustomEvent('editNote', { detail: { id } }));
    };
  </script>
</body>
</html>
