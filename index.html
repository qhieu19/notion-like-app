<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Personal Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📓 Personal Workspace</h1>
  </header>

  <main>
    <div class="home-container">
      <div class="notion-home-header">
        <div class="large-icon">📓</div>
        <h2>Workspace</h2>
      </div>

      <div class="section-label" style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim);">Pages</div>
      <div class="home-options">
        <a href="notes.html" class="home-card">
          <div class="home-card-icon">📝</div>
          <div class="home-card-text">
            <h3>Notes</h3>
            <p>Write, format, and organize notes</p>
          </div>
          <span class="home-card-arrow">›</span>
        </a>
        <a href="tasks.html" class="home-card">
          <div class="home-card-icon">📋</div>
          <div class="home-card-text">
            <h3>Task Board</h3>
            <p>Kanban flow across backlog and status</p>
          </div>
          <span class="home-card-arrow">›</span>
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
