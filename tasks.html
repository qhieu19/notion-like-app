<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tasks - Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bs-container">
    <!-- Header -->
    <div class="bs-header">
      <button class="bs-btn-back" onclick="window.location.href='index.html'">Back to menu</button>
      <div class="bs-header-date" id="current-date">Loading...</div>
    </div>

    <!-- Nav Tabs -->
    <nav class="bs-nav-tabs">
      <button class="bs-nav-link active" data-status="todo">To do</button>
      <button class="bs-nav-link" data-status="in-progress">In progress</button>
      <button class="bs-nav-link" data-status="done">Done</button>
    </nav>

    <!-- Task List -->
    <div class="bs-task-list" id="task-list">
      <p class="text-muted text-center" style="margin-top: 2rem;">No tasks yet. Click Create new task to get started.</p>
    </div>

    <!-- Create Button -->
    <button class="bs-btn-create" id="btn-create">Create new task</button>
  </div>

  <!-- Task Detail Modal -->
  <div class="bs-modal-backdrop" id="task-detail-modal">
    <div class="bs-modal-dialog">
      <div class="bs-modal-header">
        <h5 class="bs-modal-title" id="detail-title">Task Title</h5>
        <button class="bs-btn-close" id="close-detail">×</button>
      </div>
      <div class="bs-modal-body">
        <div class="bs-detail-section">
          <div class="bs-detail-label">Status</div>
          <div class="bs-detail-value" id="detail-status"></div>
        </div>
        <div class="bs-detail-section">
          <div class="bs-detail-label">Priority</div>
          <div class="bs-detail-value" id="detail-priority"></div>
        </div>
        <div class="bs-detail-section">
          <div class="bs-detail-label">Description</div>
          <div class="bs-detail-value" id="detail-description">No description</div>
        </div>
        <div class="bs-detail-section">
          <div class="bs-detail-label">Column</div>
          <div class="bs-detail-value" id="detail-column"></div>
        </div>
        <div class="bs-detail-section">
          <div class="bs-detail-label">Created</div>
          <div class="bs-detail-value" id="detail-created"></div>
        </div>
      </div>
      <div class="bs-modal-footer">
        <button class="bs-btn bs-btn-secondary" id="btn-edit">Update</button>
        <button class="bs-btn bs-btn-primary" id="btn-change-status">Change status</button>
        <button class="bs-btn bs-btn-danger" id="btn-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Task Form Modal -->
  <div class="modal" id="task-form-modal">
    <div class="modal-content">
      <h2 id="form-title">New task</h2>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Task title" required autocomplete="off">
        <textarea id="task-description" placeholder="Description (optional)" rows="4"></textarea>

        <label for="task-status">Status</label>
        <select id="task-status" required>
          <option value="todo">To do</option>
          <option value="in-progress">In progress</option>
          <option value="done">Done</option>
        </select>

        <label for="task-priority">Priority</label>
        <select id="task-priority" required>
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <label for="task-column">Column</label>
        <select id="task-column" required>
          <option value="backlog">Backlog</option>
          <option value="todo" selected>To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="cancel-task">Cancel</button>
          <button type="submit">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
