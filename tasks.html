<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tasks - Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">‹ Home</a>
      <span style="color: var(--text-dim); font-size: 13px;">/</span>
      <h1>📋 Tasks</h1>
    </div>
  </header>

  <main style="max-width: 540px; padding-bottom: 100px;">
    <!-- Date Header -->
    <div class="date-header">
      <div class="date-text" id="current-date">Loading...</div>
    </div>

    <!-- Status Filter Buttons -->
    <div class="status-filters">
      <button class="status-btn active" data-status="todo">
        <div class="status-icon">⭕</div>
        <div class="status-label">To Do</div>
        <div class="status-count" id="count-todo">0</div>
      </button>
      <button class="status-btn" data-status="in-progress">
        <div class="status-icon">🔄</div>
        <div class="status-label">In Progress</div>
        <div class="status-count" id="count-in-progress">0</div>
      </button>
      <button class="status-btn" data-status="done">
        <div class="status-icon">✓</div>
        <div class="status-label">Done</div>
        <div class="status-count" id="count-done">0</div>
      </button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="task-list">
      <p class="empty-state">No tasks yet. Press + to create one.</p>
    </div>

    <!-- Add Task Button -->
    <button class="add-task-btn" id="add-task-btn">+</button>
  </main>

  <!-- Task Detail Modal -->
  <div class="task-detail-overlay" id="task-detail-modal">
    <div class="task-detail-card">
      <div class="detail-header">
        <div class="detail-title" id="detail-title">Task Title</div>
        <button class="close-detail" id="close-detail">×</button>
      </div>

      <div class="detail-section">
        <div class="detail-label">Priority</div>
        <div class="detail-content" id="detail-priority"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Status</div>
        <div class="detail-content" id="detail-status"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Description</div>
        <div class="detail-content" id="detail-description">No description</div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Column</div>
        <div class="detail-content" id="detail-column"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Created</div>
        <div class="detail-content" id="detail-created"></div>
      </div>

      <div class="detail-actions">
        <button class="btn-action" id="btn-edit-task">Edit</button>
        <button class="btn-action" id="btn-delete-task">Delete</button>
        <button class="btn-action primary" id="btn-toggle-status">Mark as Done</button>
      </div>
    </div>
  </div>

  <!-- Task Form Modal -->
  <div class="modal" id="task-form-modal">
    <div class="modal-content">
      <h2 id="form-title">New task</h2>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Task title" required autocomplete="off">
        <textarea id="task-description" placeholder="Description (optional)" rows="4"></textarea>

        <label for="task-status">Status</label>
        <select id="task-status" required>
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <label for="task-priority">Priority</label>
        <select id="task-priority" required>
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <label for="task-column">Column</label>
        <select id="task-column" required>
          <option value="backlog">Backlog</option>
          <option value="todo" selected>To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="cancel-task">Cancel</button>
          <button type="submit">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
