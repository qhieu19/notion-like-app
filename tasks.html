<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tasks - Notion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="blue-container">
    <!-- Header -->
    <div class="blue-header">
      <div class="date-small" id="current-date-small">Loading...</div>
      <div class="page-title">Hôm nay</div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Cần làm</div>
        <div class="stat-value" id="stat-todo">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Đang làm</div>
        <div class="stat-value" id="stat-in-progress">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Xong tuần này</div>
        <div class="stat-value" id="stat-done">0</div>
      </div>
    </div>

    <!-- Active Task Card -->
    <div class="active-section" id="active-section" style="display: none;">
      <div class="active-card" id="active-card">
        <div class="active-header">
          <div class="active-status">Đang làm</div>
          <div class="active-deadline" id="active-deadline">Hạn hôm nay</div>
        </div>
        <div class="active-title" id="active-title"></div>
        <div class="active-meta" id="active-meta"></div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="active-progress" style="width: 0%"></div>
        </div>
        <button class="btn-complete" id="btn-complete-active">Hoàn thành</button>
      </div>
    </div>

    <!-- Task List -->
    <div class="section-header">Cần xử lý</div>
    <div class="task-list" id="task-list">
      <p class="empty-state">Chưa có task. Nhấn Thêm để tạo mới.</p>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item active">Hôm nay</div>
      <div class="nav-item" onclick="alert('Chức năng đang phát triển')">Bảng</div>
      <div class="nav-item" id="nav-add">Thêm</div>
    </div>
  </main>

  <!-- Task Detail Modal -->
  <div class="task-detail-overlay" id="task-detail-modal">
    <div class="task-detail-card">
      <div class="detail-header">
        <div class="detail-title" id="detail-title">Task Title</div>
        <button class="close-detail" id="close-detail">×</button>
      </div>

      <div class="detail-section">
        <div class="detail-label">Trạng thái</div>
        <div class="detail-content" id="detail-status"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Ưu tiên</div>
        <div class="detail-content" id="detail-priority"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Mô tả</div>
        <div class="detail-content" id="detail-description">Không có mô tả</div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Cột</div>
        <div class="detail-content" id="detail-column"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Tạo lúc</div>
        <div class="detail-content" id="detail-created"></div>
      </div>

      <div class="detail-actions">
        <button class="btn-action" id="btn-edit-task">Sửa</button>
        <button class="btn-action" id="btn-delete-task">Xóa</button>
        <button class="btn-action primary" id="btn-toggle-status">Hoàn thành</button>
      </div>
    </div>
  </div>

  <!-- Task Form Modal -->
  <div class="modal" id="task-form-modal">
    <div class="modal-content">
      <h2 id="form-title">Task mới</h2>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Tiêu đề task" required autocomplete="off">
        <textarea id="task-description" placeholder="Mô tả (tùy chọn)" rows="4"></textarea>

        <label for="task-status">Trạng thái</label>
        <select id="task-status" required>
          <option value="todo">Cần làm</option>
          <option value="in-progress">Đang làm</option>
          <option value="done">Hoàn thành</option>
        </select>

        <label for="task-priority">Ưu tiên</label>
        <select id="task-priority" required>
          <option value="low">Thấp</option>
          <option value="medium" selected>Trung bình</option>
          <option value="high">Cao</option>
        </select>

        <label for="task-column">Cột</label>
        <select id="task-column" required>
          <option value="backlog">Backlog</option>
          <option value="todo" selected>To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="cancel-task">Hủy</button>
          <button type="submit">Lưu task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
